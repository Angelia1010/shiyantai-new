# 数据源定义（保持不变）
data_sources:
  pressure:
    - PT1    # 主油箱压力
    - PT2    # 供油压力
    - PT3    # 控制口压力
    - PT4    # 排油口压力
    - PT5    # 出油口压力
    - PT6    # 回油压力
    - PT7    # 滑油压力
    - PT8    # 增速箱滑油压力
    - PT9    # 轴箱滑油压力
    - PT10   # 适配器滑油压力
    - APT1   # 高压气压力
    - APT2   # 低压气压力

  vibration:
    - X
    - Y
    - Z

  temperature:
    - RTD1    # 主油箱温度
    - RTD2    # 供油温度
    - RTD3    # 控制口温度
    - RTD4    # 排油口温度
    - RTD5    # 出口温度
    - RTD6    # 滑油箱温度
    - RTD7    # 适配器滑油温度
    - RTD8    # 轴箱前温度
    - RTD9    # 轴箱后温度
    - RTD10   # 适配器温度
    - RTD11   # 电机温度
    - RTD16   # 实验间温度
    - RTD17   # 配电柜温度
    - RTD18   # 加热器出口温度

  flow:
    - FM1    # 排油流量
    - FM2    # 回油流量

  level:
    - LT1     # 主油箱液位
    - LT2     # 滑油油箱液位

  mechanics:
    - speed    #转速
    - torque   #转矩
    - drain_mass_flow #排油质量流量
    - return_mass_flow #回油质量流量

# 特征定义（新增随动活塞相关特征）
feature_definitions:
  pressure:
    - name: plunger_pressure_diff
      formula: "PT3 - PT4"
      description: "随动活塞压差"
      window: 30s
      depends_on: [PT3, PT4]

    - name: plunger_pressure_fluctuation
      formula: "std(PT3 - PT4)"
      description: "随动活塞压力波动"
      window: 60s
      depends_on: [PT3, PT4]

    - name: control_flow_ratio
      formula: "(FM1 - FM2)/(speed + 1e-6)"
      description: "控制流量比"
      window: 30s
      depends_on: [FM1, FM2, speed]
    
    - name: valve_pressure_ratio
      formula: "PT4/(PT3 + 1e-6)"
      description: "控制活门压力比"
      window: 20s
      depends_on: [PT3, PT4]

    - name: valve_pressure_fluctuation
      formula: "std(PT3)/mean(PT3)"
      description: "控制压力波动系数"
      window: 30s
      depends_on: [PT3]

  flow:
    - name: valve_leakage_rate
      formula: "(FM1 - 0.92*FM2)/APT1"
      description: "活门泄漏率系数"
      window: 60s
      depends_on: [FM1, FM2, APT1]

  vibration:
    - name: plunger_vibration
      formula: "sqrt(mean(Y**2))"
      description: "活塞径向振动"
      window: 10s
      processing:
        - type: fft
          params: {n: 2048}
      depends_on: [Y]

    - name: vibration_energy
      formula: "sqrt(mean(X**2 + Y**2 + Z**2))"
      description: "合成振动能量"
      processing:
        - type: fft
          params: {n: 2048}
      depends_on: [X,Y,Z]
    

    - name: rail_vibration_energy
      formula: "sqrt(mean(X**2 + Y**2))"
      description: "滑轨振动能量"
      window: 15s
      processing:
        - type: fft
          params: {n: 2048}
        - type: wavelet
          params: {wavelet: 'db4', level: 5}
      depends_on: [X,Y]


  temperature:
    - name: plunger_temp_gradient
      formula: "RTD3 - RTD4"
      description: "活塞温度梯度"
      window: 60s
      depends_on: [RTD3, RTD4]
    
    - name: rail_temp_gradient
      formula: "RTD8 - RTD9"
      description: "滑轨轴向温升梯度"
      window: 300s
      depends_on: [RTD8, RTD9]

    - name: valve_temp_gradient
      formula: "RTD3 - RTD4"
      description: "活门温度梯度"
      window: 180s
      depends_on: [RTD3, RTD4]
    
  mechanics:
      - name: torque_ripple
        formula: "std(torque)/(mean(torque)+1e-6)"
        description: "转矩纹波系数"
        window: 30s
        depends_on: [torque]

# 故障模式配置（增强随动活塞故障检测）
fault_modes:
  plunger_wear:
    name: "随动活塞磨损"
    description: "液压泵随动活塞磨损故障"
    severity_levels:
      - level: 1
        threshold: 0.1
        action: "检查随动活塞密封性"
      - level: 2
        threshold: 0.2 
        action: "立即停机更换活塞"
      - level: 3
        threshold: 0.3
        action: "紧急停机并检查液压系统"
    detection_rules:
      - feature: plunger_pressure_diff
        condition: "value > 2.5 or value < 0.8"
        weight: 0.4
        duration: 30s
        description: "活塞压差异常"

      - feature: plunger_pressure_fluctuation
        condition: "value > 0.5"
        weight: 0.4
        duration: 60s
        description: "活塞压力波动过大"

      - feature: control_flow_ratio
        condition: "abs(value - 0.15) > 0.05"
        weight: 0.15
        duration: 30s
        description: "控制流量比偏离正常值"

      - feature: plunger_temp_gradient
        condition: "value < 3200"
        weight: 0.1
        duration: 120s
        description: "活塞温度梯度异常"
      
  rail_wear:
    name: "滑轨磨损"
    description: "柱塞泵滑轨磨损故障"
    severity_levels:
      - level: 1
        threshold: 0.15
        action: "检查滑轨润滑系统"
      - level: 2
        threshold: 0.3 
        action: "安排滑轨维护"
      - level: 3
        threshold: 0.5
        action: "紧急停机更换滑轨"
    detection_rules:
      - feature: rail_temp_gradient
        condition: "value > 45 or value < 15"
        weight: 0.4
        duration: 300s
        description: "滑轨轴向温升异常"

      - feature: torque_ripple
        condition: "value > 0.18"
        weight: 0.3
        duration: 60s
        description: "转矩波动异常"

  control_valve_wear:
    name: "控制活门磨损"
    description: "液压控制活门磨损故障"
    severity_levels:
      - level: 1
        threshold: 0.25
        action: "检查活门密封面"
      - level: 2
        threshold: 0.5 
        action: "校准活门行程"
      - level: 3
        threshold: 0.75
        action: "更换控制活门"
    detection_rules:
      - feature: valve_pressure_ratio
        condition: "value < 0.65 or value > 0.85"
        weight: 0.5
        duration: 30s
        description: "压力比异常"

      - feature: valve_leakage_rate
        condition: "abs(value) > 0.25"
        weight: 0.4
        duration: 120s
        description: "泄漏率超标"

      - feature: valve_temp_gradient
        condition: "abs(value) > 120"
        weight: 0.3
        duration: 300s
        description: "温度梯度超限"



# 系统参数优化
settings:
  sampling_rate: 100
  realtime_window: 120s
  result_cache: 600
  alarm_delay: 5s