# 生产部署示例：Nginx 提供前端静态文件，并把 /api/<服务> 转发到本机的各后端服务。
# 前端构建：cd digital-twin-platform && npm run build:prod，产物在 dist/。
server {
    listen 80;
    server_name _;

    root   /path/to/shiyantai-new/digital-twin-platform/dist;
    index  index.html;

    # 上传/请求体上限（初步诊断会提交整份试验数据的特征）
    client_max_body_size 50m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/task/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_read_timeout 300s;
    }

    location /api/file/ {
        proxy_pass http://127.0.0.1:5002/;
    }

    # 大模型分析为流式响应，关闭缓冲并放宽超时
    location /api/ai/ {
        proxy_pass http://127.0.0.1:8999/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # AMESim 服务自身的路由以 /api 开头
    location /api/amesim/ {
        proxy_pass http://127.0.0.1:5003/api/;
        proxy_read_timeout 900s;
    }
}
